<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" role="img" aria-labelledby="t d">
  <title id="t">Elinor Ostrom’s eight design principles</title>
  <desc id="d">Eight principles for governing a commons, arranged in a ring around the commons.</desc>
  <rect width="600" height="540" fill="#ffffff"/>
  <circle cx="300" cy="270" r="96" fill="#e4ecd9" stroke="#7fa868" stroke-width="2"/>
  <circle cx="300" cy="270" r="196" fill="none" stroke="#d9d2c4" stroke-width="2" stroke-dasharray="4 6"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#222222">  <text x="300" y="264" font-size="18" font-style="italic">the</text>
  <text x="300" y="292" font-size="28" >commons</text></g>
  <circle cx="300" cy="74" r="56" fill="#ffffff" stroke="#d6a15b" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#d6a15b">  <text x="300" y="56" font-size="18" >1</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#333333">  <text x="300" y="76" font-size="11.5" >Clear</text>
  <text x="300" y="91" font-size="11.5" >boundaries</text></g>
  <circle cx="438.6" cy="131.4" r="56" fill="#ffffff" stroke="#d6a15b" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#d6a15b">  <text x="438.6" y="113.4" font-size="18" >2</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#333333">  <text x="438.6" y="133.4" font-size="11.5" >Rules fit</text>
  <text x="438.6" y="148.4" font-size="11.5" >local conditions</text></g>
  <circle cx="496" cy="270" r="56" fill="#ffffff" stroke="#d6a15b" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#d6a15b">  <text x="496" y="252" font-size="18" >3</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#333333">  <text x="496" y="272" font-size="11.5" >Those affected</text>
  <text x="496" y="287" font-size="11.5" >make the rules</text></g>
  <circle cx="438.6" cy="408.6" r="56" fill="#ffffff" stroke="#d6a15b" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#d6a15b">  <text x="438.6" y="390.6" font-size="18" >4</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#333333">  <text x="438.6" y="410.6" font-size="11.5" >Monitoring</text>
  <text x="438.6" y="425.6" font-size="11.5" >by the community</text></g>
  <circle cx="300" cy="466" r="56" fill="#ffffff" stroke="#d6a15b" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#d6a15b">  <text x="300" y="448" font-size="18" >5</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#333333">  <text x="300" y="468" font-size="11.5" >Graduated</text>
  <text x="300" y="483" font-size="11.5" >sanctions</text></g>
  <circle cx="161.4" cy="408.6" r="56" fill="#ffffff" stroke="#d6a15b" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#d6a15b">  <text x="161.4" y="390.6" font-size="18" >6</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#333333">  <text x="161.4" y="410.6" font-size="11.5" >Cheap, fast</text>
  <text x="161.4" y="425.6" font-size="11.5" >conflict resolution</text></g>
  <circle cx="104" cy="270" r="56" fill="#ffffff" stroke="#d6a15b" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#d6a15b">  <text x="104" y="252" font-size="18" >7</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#333333">  <text x="104" y="272" font-size="11.5" >Right to</text>
  <text x="104" y="287" font-size="11.5" >self-organise</text></g>
  <circle cx="161.4" cy="131.4" r="56" fill="#ffffff" stroke="#d6a15b" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#d6a15b">  <text x="161.4" y="113.4" font-size="18" >8</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#333333">  <text x="161.4" y="133.4" font-size="11.5" >Nested</text>
  <text x="161.4" y="148.4" font-size="11.5" >enterprises</text></g>

</svg>
