<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" role="img" aria-labelledby="t d">
  <title id="t">Twelve leverage points</title>
  <desc id="d">Donella Meadows’ twelve places to intervene in a system, from numbers and parameters (least effective) to the power to transcend paradigms (most effective).</desc>
  <rect width="600" height="540" fill="#ffffff"/>
  <rect x="200" y="30" width="200" height="32" rx="6" fill="#7fa868" fill-opacity="0.15"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222222" text-anchor="middle">  <text x="300" y="51" font-size="13" >12 · Numbers: constants and parameters</text></g>
  <rect x="186" y="68" width="228" height="32" rx="6" fill="#7fa868" fill-opacity="0.22"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222222" text-anchor="middle">  <text x="300" y="89" font-size="13" >11 · Sizes of buffers and stocks</text></g>
  <rect x="172" y="106" width="256" height="32" rx="6" fill="#7fa868" fill-opacity="0.29"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222222" text-anchor="middle">  <text x="300" y="127" font-size="13" >10 · Structure of stocks and flows</text></g>
  <rect x="158" y="144" width="284" height="32" rx="6" fill="#7fa868" fill-opacity="0.36"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222222" text-anchor="middle">  <text x="300" y="165" font-size="13" >9 · Lengths of delays</text></g>
  <rect x="144" y="182" width="312" height="32" rx="6" fill="#7fa868" fill-opacity="0.43"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222222" text-anchor="middle">  <text x="300" y="203" font-size="13" >8 · Strength of balancing feedback loops</text></g>
  <rect x="130" y="220" width="340" height="32" rx="6" fill="#7fa868" fill-opacity="0.50"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222222" text-anchor="middle">  <text x="300" y="241" font-size="13" >7 · Gain of reinforcing feedback loops</text></g>
  <rect x="116" y="258" width="368" height="32" rx="6" fill="#7fa868" fill-opacity="0.57"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222222" text-anchor="middle">  <text x="300" y="279" font-size="13" >6 · Structure of information flows</text></g>
  <rect x="102" y="296" width="396" height="32" rx="6" fill="#7fa868" fill-opacity="0.64"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222222" text-anchor="middle">  <text x="300" y="317" font-size="13" >5 · Rules of the system</text></g>
  <rect x="88" y="334" width="424" height="32" rx="6" fill="#7fa868" fill-opacity="0.71"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222222" text-anchor="middle">  <text x="300" y="355" font-size="13" >4 · Power to self-organise</text></g>
  <rect x="74" y="372" width="452" height="32" rx="6" fill="#7fa868" fill-opacity="0.78"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222222" text-anchor="middle">  <text x="300" y="393" font-size="13" >3 · Goals of the system</text></g>
  <rect x="60" y="410" width="480" height="32" rx="6" fill="#7fa868" fill-opacity="0.85"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222222" text-anchor="middle">  <text x="300" y="431" font-size="13" >2 · The paradigm behind the system</text></g>
  <rect x="46" y="448" width="508" height="32" rx="6" fill="#7fa868" fill-opacity="0.92"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222222" text-anchor="middle">  <text x="300" y="469" font-size="13" >1 · The power to transcend paradigms</text></g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#717171" font-size="12">  <text x="14" y="26" font-size="12" >easier to push, less effect</text>  <text x="14" y="516" font-size="12" >harder to see, more effect</text></g>
  <path d="M584 40 L584 480 m-7 -10 l7 10 l7 -10" stroke="#7fa868" stroke-width="2" fill="none"/>
</svg>
