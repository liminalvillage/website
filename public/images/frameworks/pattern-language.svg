<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" role="img" aria-labelledby="t d">
  <title id="t">A Pattern Language</title>
  <desc id="d">Patterns at five scales, from region and town down to construction, each with example patterns.</desc>
  <rect width="600" height="540" fill="#ffffff"/>
  <rect x="30" y="22" width="540" height="80" rx="12" fill="#e4ecd9" stroke="#7fa868" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#222222" text-anchor="middle">  <text x="300" y="56" font-size="22" >Region &amp; town</text></g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#333333" text-anchor="middle">  <text x="300" y="80" font-size="12.5" >Independent regions · Activity nodes · Small public squares</text></g>
  <rect x="55" y="118" width="490" height="80" rx="12" fill="#dfe9f2" stroke="#8fa9c2" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#222222" text-anchor="middle">  <text x="300" y="152" font-size="22" >Neighbourhood</text></g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#333333" text-anchor="middle">  <text x="300" y="176" font-size="12.5" >Identifiable neighbourhood · Common land</text></g>
  <rect x="80" y="214" width="440" height="80" rx="12" fill="#f3e6cf" stroke="#d6a15b" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#222222" text-anchor="middle">  <text x="300" y="248" font-size="22" >Building</text></g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#333333" text-anchor="middle">  <text x="300" y="272" font-size="12.5" >Light on two sides of every room · Entrance transition</text></g>
  <rect x="105" y="310" width="390" height="80" rx="12" fill="#f6dcd2" stroke="#c98b74" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#222222" text-anchor="middle">  <text x="300" y="344" font-size="22" >Room &amp; garden</text></g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#333333" text-anchor="middle">  <text x="300" y="368" font-size="12.5" >Window place · Garden seat · Sunny counter</text></g>
  <rect x="130" y="406" width="340" height="80" rx="12" fill="#e4e0ee" stroke="#9a8fb8" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#222222" text-anchor="middle">  <text x="300" y="440" font-size="22" >Construction</text></g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#333333" text-anchor="middle">  <text x="300" y="464" font-size="12.5" >Good materials · Gradual stiffening</text></g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#717171" text-anchor="middle">  <text x="300" y="528" font-size="12.5" >Each pattern helps complete the larger ones and is completed by the smaller.</text></g>
</svg>
