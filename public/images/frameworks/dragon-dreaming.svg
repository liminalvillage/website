<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" role="img" aria-labelledby="t d">
  <title id="t">Dragon Dreaming</title>
  <desc id="d">A wheel with four phases of a project: dreaming, planning, doing and celebrating.</desc>
  <rect width="600" height="540" fill="#ffffff"/>
  <path d="M300 265 L100 265 A200 200 0 0 1 300 65 Z" fill="#dfe9f2" stroke="#ffffff" stroke-width="4"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#222222">  <text x="216.6" y="181.6" font-size="22" >Dreaming</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#333333">  <text x="216.6" y="201.6" font-size="12" >whose dream is it?</text></g>
  <path d="M300 265 L300 65 A200 200 0 0 1 500 265 Z" fill="#f3e6cf" stroke="#ffffff" stroke-width="4"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#222222">  <text x="383.4" y="181.6" font-size="22" >Planning</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#333333">  <text x="383.4" y="201.6" font-size="12" >how do we get there?</text></g>
  <path d="M300 265 L500 265 A200 200 0 0 1 300 465 Z" fill="#f6dcd2" stroke="#ffffff" stroke-width="4"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#222222">  <text x="383.4" y="348.4" font-size="22" >Doing</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#333333">  <text x="383.4" y="368.4" font-size="12" >act and track</text></g>
  <path d="M300 265 L300 465 A200 200 0 0 1 100 265 Z" fill="#e4ecd9" stroke="#ffffff" stroke-width="4"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#222222">  <text x="216.6" y="348.4" font-size="22" >Celebrating</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#333333">  <text x="216.6" y="368.4" font-size="12" >harvest, learn, rest</text></g>
  <circle cx="300" cy="265" r="34" fill="#ffffff" stroke="#d6a15b" stroke-width="2"/>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#717171">  <text x="300" y="269" font-size="11" >project</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#717171">  <text x="300" y="500" font-size="13" >personal growth · community building · service to the Earth</text>  <text x="300" y="520" font-size="12" >Each phase holds a smaller wheel of all four.</text></g>
</svg>
