<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" role="img" aria-labelledby="t d">
  <title id="t">Emergent Strategy</title>
  <desc id="d">Six elements of emergent strategy around a centre: fractal, adaptive, interdependent, non-linear, resilient, creating more possibilities.</desc>
  <rect width="600" height="540" fill="#ffffff"/>
  <line x1="300" y1="260" x2="300" y2="80" stroke="#d9d2c4" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="300" y1="260" x2="455.9" y2="170" stroke="#d9d2c4" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="300" y1="260" x2="455.9" y2="350" stroke="#d9d2c4" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="300" y1="260" x2="300" y2="440" stroke="#d9d2c4" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="300" y1="260" x2="144.1" y2="350" stroke="#d9d2c4" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="300" y1="260" x2="144.1" y2="170" stroke="#d9d2c4" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="300" cy="260" r="74" fill="#f3e6cf" stroke="#d6a15b" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#222222">  <text x="300" y="254" font-size="20" >emergent</text>  <text x="300" y="280" font-size="20" >strategy</text></g>
  <circle cx="300" cy="80" r="62" fill="#ffffff" stroke="#7fa868" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#222222">  <text x="300" y="78" font-size="16" >Fractal</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#717171">  <text x="300" y="96" font-size="10.5" >small scale shapes large</text></g>
  <circle cx="455.9" cy="170" r="62" fill="#ffffff" stroke="#7fa868" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#222222">  <text x="455.9" y="168" font-size="16" >Adaptive</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#717171">  <text x="455.9" y="186" font-size="10.5" >change with intention</text></g>
  <circle cx="455.9" cy="350" r="62" fill="#ffffff" stroke="#7fa868" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#222222">  <text x="455.9" y="348" font-size="13.5" >Interdependent</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#717171">  <text x="455.9" y="366" font-size="10.5" >and decentralised</text></g>
  <circle cx="300" cy="440" r="62" fill="#ffffff" stroke="#7fa868" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#222222">  <text x="300" y="438" font-size="16" >Non-linear</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#717171">  <text x="300" y="456" font-size="10.5" >and iterative</text></g>
  <circle cx="144.1" cy="350" r="62" fill="#ffffff" stroke="#7fa868" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#222222">  <text x="144.1" y="348" font-size="16" >Resilient</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#717171">  <text x="144.1" y="366" font-size="10.5" >transformative justice</text></g>
  <circle cx="144.1" cy="170" r="62" fill="#ffffff" stroke="#7fa868" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#222222">  <text x="144.1" y="168" font-size="13.5" >More possibilities</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#717171">  <text x="144.1" y="186" font-size="10.5" >open, not closed</text></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#717171">  <text x="300" y="528" font-size="12" font-style="italic">“Move at the speed of trust. Focus on critical connections more than critical mass.”</text></g>
</svg>
