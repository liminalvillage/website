<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Readings &amp; Media · Liminal Village</title>
<meta name="description" content="Articles, papers, talks and videos from Liminal Village — readings on permaculture economics, cosmo-local networks, holons and regenerative communities.">
<link rel="icon" type="image/svg+xml" href="/vite.svg">
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.1/css/all.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --text:#333; --primary:#D6A15B; --light:#EFEFEF; --dark:#222; --grey:#717171; --line:#e4e4e4; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Open Sans",sans-serif;font-size:15px;color:var(--text);background:#fff;line-height:1.7;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;transition:color .3s;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px;}

  header{border-bottom:1px solid var(--line);}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:70px;}
  .brand{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500;letter-spacing:2px;color:var(--dark);}
  .back{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--grey);}
  .back:hover{color:var(--primary);}

  .intro{padding:64px 0 32px;text-align:center;}
  .intro h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:46px;letter-spacing:3px;color:var(--dark);line-height:1.1;}
  .intro h1 span{color:var(--primary);}
  .intro p{max-width:560px;margin:18px auto 0;color:var(--grey);letter-spacing:.5px;}

  .filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px 0 40px;}
  .filters button{border:1px solid var(--line);background:#fff;border-radius:24px;padding:7px 18px;font:inherit;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--grey);cursor:pointer;transition:all .3s;}
  .filters button:hover{border-color:var(--primary);color:var(--primary);}
  .filters button.active{background:var(--dark);border-color:var(--dark);color:#fff;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px;padding-bottom:80px;}
  .card{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:#fff;transition:box-shadow .3s,transform .3s;}
  .card:hover{box-shadow:0 10px 30px rgba(0,0,0,.08);transform:translateY(-2px);}
  .card.hidden{display:none;}
  .thumb{aspect-ratio:16/9;background:var(--light);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .thumb img,.thumb iframe,.thumb video{width:100%;height:100%;object-fit:cover;display:block;border:0;}
  .thumb .ic{font-size:44px;color:var(--primary);}
  .thumb .kind{position:absolute;top:12px;left:12px;background:rgba(34,34,34,.85);color:#fff;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:4px;}
  .meta{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .meta .src{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--primary);}
  .meta h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:24px;letter-spacing:.5px;line-height:1.2;color:var(--dark);}
  .meta .by{font-size:13px;color:var(--grey);}
  .meta p{font-size:14px;color:#555;flex:1;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--dark);border-radius:6px;padding:9px 16px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dark);transition:all .3s;}
  .btn:hover{background:var(--dark);color:#fff;}
  .btn.ghost{border-color:var(--line);color:var(--grey);}
  .btn.ghost:hover{border-color:var(--primary);background:#fff;color:var(--primary);}

  .empty{text-align:center;color:var(--grey);padding:60px 0 100px;}

  footer{background:var(--dark);color:#fff;padding:32px 0;text-align:center;font-size:12px;letter-spacing:1.5px;}
  footer a{color:var(--primary);}

  @media(max-width:600px){
    .intro{padding:44px 0 24px;}
    .intro h1{font-size:34px;}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a href="/" class="brand">Liminal Village</a>
    <a href="/" class="back"><i class="fa-solid fa-arrow-left"></i>&nbsp; Back to site</a>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <h1>Readings <span>&amp;</span> Media</h1>
    <p>Articles, papers, talks and videos from the Liminal Village — on permaculture economics, cosmo‑local networks, holons and regenerative community.</p>
  </section>

  <div class="filters" id="filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="onboarding">Onboarding</button>
    <button data-filter="reading">Readings</button>
    <button data-filter="video">Videos</button>
  </div>

  <section class="grid" id="grid"></section>
  <p class="empty" id="empty" hidden>Nothing here yet.</p>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> Liminal Village &nbsp;·&nbsp; <a href="/">liminalvillage.com</a></div>
</footer>

<script>
/*
 * Add new items here. Files live in /public/media/ (served at /media/...).
 *
 *  type:   'reading' (PDF / article) or 'video'
 *  tags:   optional extra categories, e.g. ['onboarding'] — shown as a filter button
 *  file:   path to a local PDF or MP4, e.g. '/media/my-paper.pdf'
 *  url:    external link (article page, YouTube/Vimeo/PeerTube watch page)
 *  embed:  iframe embed URL for videos, e.g. 'https://www.youtube.com/embed/VIDEO_ID'
 *  links:  optional extra buttons, e.g. [{ label: 'Full film', href: 'https://…' }]
 *  thumb:  optional cover image, e.g. '/media/my-paper.jpg'
 *  source: publication / venue label
 *  date:   ISO date (YYYY-MM-DD), shown on the card — items appear in the order listed here
 */
const ITEMS = [
  {
    type: 'reading',
    title: 'How We Contribute: Permaculture Economics for Regenerative Cosmo‑Local Networks',
    authors: 'Roberto Valenti & Jillian Hovey',
    source: 'Permaculture Design Magazine #126',
    date: '2022-11-01',
    description: 'How can a regenerative project recognise and reward every kind of contribution — not just money? An article on permaculture economics, holons and cosmo‑local networks, with a foreword by Jillian Hovey.',
    file: '/media/how-we-contribute-permaculture-economics-pcd126.pdf',
  },
  {
    type: 'video',
    tags: ['onboarding'],
    title: 'Paradise or Oblivion',
    authors: 'The Venus Project · Jacque Fresco & Roxanne Meadows',
    source: 'Documentary · 48 min',
    date: '2012-03-01',
    description: 'An introduction to the Resource‑Based Economy: why our current socio‑economic system produces the problems it does, and how applying science and technology to human affairs could provide for the needs of everyone.',
    embed: 'https://www.youtube.com/embed/KphWsnhZ4Ag',
    url: 'https://www.youtube.com/watch?v=KphWsnhZ4Ag',
  },
  {
    type: 'video',
    tags: ['onboarding'],
    title: 'Zeitgeist: Moving Forward',
    authors: 'Peter Joseph',
    source: 'Documentary · 2 h 41 min',
    date: '2011-01-15',
    description: 'The case for a transition out of the monetary‑market paradigm: human nature and environment, the structural flaws of the current economy, and what a scientifically‑grounded, needs‑based global system could look like.',
    embed: 'https://www.youtube.com/embed/4Z9WVZddH9w',
    url: 'https://www.youtube.com/watch?v=4Z9WVZddH9w',
  },
  {
    type: 'video',
    tags: ['onboarding'],
    title: 'A Gathering of the Tribe',
    authors: 'Charles Eisenstein · animation by Aldous Massie, score by Jon Hopkins',
    source: 'Short film · 9 min',
    date: '2021-12-07',
    description: 'An allegory about the souls who chose to come to Earth at this moment — read by Charles Eisenstein from the final chapter of The More Beautiful World Our Hearts Know Is Possible. A reminder of why we are here, and that we did not come alone.',
    embed: 'https://www.youtube.com/embed/XinVOpdcbVc',
    url: 'https://www.youtube.com/watch?v=XinVOpdcbVc',
    links: [
      { label: 'Read the essay', href: 'https://charleseisenstein.org/essays/a-gathering-of-the-tribe-2/' },
    ],
  },
  {
    type: 'video',
    tags: ['onboarding'],
    title: '“This isn’t Utopia, friend”',
    authors: 'Scene from InterReflections · Peter Joseph',
    source: 'Film scene',
    date: '2020-10-06',
    description: 'A short scene from InterReflections, set in a future that has already made the transition: a glimpse of what a post‑scarcity, needs‑based society could actually feel like day to day — not a utopia, just a world that stopped organising itself around scarcity. The full film is free on the official site.',
    embed: 'https://www.youtube.com/embed/Nwin21oJB_E',
    url: 'https://www.youtube.com/watch?v=Nwin21oJB_E',
    links: [
      { label: 'Full film', href: 'https://www.interreflectionsmovie.com/watch' },
    ],
  },
  {
    type: 'video',
    tags: ['onboarding'],
    title: 'An Initiation to Game B',
    authors: 'Jake Ruiz · Futurity · produced with Jim Rutt & Jeff Gomez',
    source: 'Animated short · 18 min',
    date: '2026-07-01',
    description: 'An animated allegory: a Game B pioneer, guided by three stewards, awakens to the realisation that she must find her tribe and help humanity step out of its path toward self‑termination by playing a new game. Game A is everything humanity has been doing for the past ten thousand years; Game B is whatever comes next.',
    embed: 'https://www.youtube.com/embed/noq5g0X57z4',
    url: 'https://www.youtube.com/watch?v=noq5g0X57z4',
    links: [
      { label: 'Intro (wiki)', href: 'https://www.gameb.wiki/index.php?title=An_Introduction_to_Game_B' },
      { label: 'What Is Game B? (Jim Rutt)', href: 'https://www.youtube.com/watch?v=HL5bcgpprxY' },
      { label: 'A Journey to GameB (essay)', href: 'https://medium.com/@memetic007/a-journey-to-gameb-4fb13772bcf3' },
    ],
  },
];

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) : '';
const matches = (it, filter) => filter === 'all' || it.type === filter || (it.tags || []).includes(filter);

function thumbHtml(it) {
  const kind = `<span class="kind">${it.type === 'video' ? 'Video' : 'PDF'}</span>`;
  if (it.type === 'video' && it.embed) {
    return `<iframe src="${esc(it.embed)}" title="${esc(it.title)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  }
  if (it.type === 'video' && it.file) {
    return `<video src="${esc(it.file)}" controls preload="metadata"${it.thumb ? ` poster="${esc(it.thumb)}"` : ''}></video>`;
  }
  if (it.thumb) return `<img src="${esc(it.thumb)}" alt="" loading="lazy">${kind}`;
  const icon = it.type === 'video' ? 'fa-circle-play' : 'fa-file-pdf';
  return `<i class="fa-regular ${icon} ic"></i>${kind}`;
}

function actionsHtml(it) {
  const a = [];
  const primary = it.file || it.url || it.embed;
  if (it.type === 'reading' && it.file) {
    a.push(`<a class="btn" href="${esc(it.file)}" target="_blank" rel="noopener"><i class="fa-solid fa-book-open"></i> Read</a>`);
    a.push(`<a class="btn ghost" href="${esc(it.file)}" download><i class="fa-solid fa-download"></i> Download</a>`);
  } else if (primary) {
    a.push(`<a class="btn" href="${esc(it.url || primary)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> ${it.type === 'video' ? 'Watch' : 'Read'}</a>`);
  }
  if (it.url && it.file) {
    a.push(`<a class="btn ghost" href="${esc(it.url)}" target="_blank" rel="noopener"><i class="fa-solid fa-link"></i> Source</a>`);
  }
  for (const l of it.links || []) {
    a.push(`<a class="btn ghost" href="${esc(l.href)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> ${esc(l.label)}</a>`);
  }
  return a.join('');
}

function render(filter = 'all') {
  const items = ITEMS;
  grid.innerHTML = items.map(it => `
    <article class="card${matches(it, filter) ? '' : ' hidden'}" data-type="${esc(it.type)}">
      <div class="thumb">${thumbHtml(it)}</div>
      <div class="meta">
        <div class="src">${esc([it.source, fmtDate(it.date)].filter(Boolean).join(' · '))}</div>
        <h2>${esc(it.title)}</h2>
        ${it.authors ? `<div class="by">${esc(it.authors)}</div>` : ''}
        ${it.description ? `<p>${esc(it.description)}</p>` : ''}
        <div class="actions">${actionsHtml(it)}</div>
      </div>
    </article>`).join('');
  empty.hidden = items.some(it => matches(it, filter));
}

document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button[data-filter]');
  if (!b) return;
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('active', x === b));
  render(b.dataset.filter);
});

document.getElementById('year').textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
